; Servatrice's configuration for docker-compose.yaml. Every key and its default
; is in Cockatrice's servatrice/servatrice.ini.example; only what differs from
; those, or what this site depends on, is set here.

[server]
name="Chickatrice"
id=1
; Logs go to the console (`docker compose logs servatrice`), not a file in the container.
writelog=0
; How often the uptime table, which the statistics pages read, gets a row (ms).
; Keep config.yaml's stats.offlineAfterSeconds comfortably above it.
statusupdate=15000
host=any
port=4747
websocket_host=any
websocket_port=4748

[authentication]
; Accounts live in the database, where this site creates and manages them.
method=sql
; false lets people without an account in as guests.
regonly=false

[users]
; Keep in step with config.yaml's cockatrice.usernames and minPasswordLength.
minnamelength=6
maxnamelength=12
minpasswordlength=6

[registration]
; Sign-ups go through the website; set true to also allow them from the client.
enabled=false

[database]
type=mysql
prefix=cockatrice
hostname=db
database=servatrice
; Must match MYSQL_ROOT_PASSWORD in docker-compose.yaml: QSettings can't read
; the environment, so change both together.
user=root
password=mysecretpassword

[rooms]
method=config
roomlist\size=1
roomlist\1\name="General room"
roomlist\1\description="Play anything here."
roomlist\1\permissionlevel=none
roomlist\1\privilegelevel=none
roomlist\1\autojoin=true
roomlist\1\chathistorysize=100
roomlist\1\game_types\size=4
roomlist\1\game_types\1\name="Standard"
roomlist\1\game_types\2\name="Commander"
roomlist\1\game_types\3\name="Modern"
roomlist\1\game_types\4\name="Casual"

[game]
store_replays=true
